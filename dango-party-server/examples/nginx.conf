# Nginx 反代示例：把 127.0.0.1:8787 暴露成 https://party.example.com
#
# 客户端只接受 https（本机 127.0.0.1 / localhost 例外），所以公网部署必须有 TLS。
# 关键点是 /db 的 SSE 长连接：必须关闭缓冲，否则「一起听歌」会卡住不更新。

server {
    listen 80;
    server_name party.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name party.example.com;

    ssl_certificate     /etc/letsencrypt/live/party.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/party.example.com/privkey.pem;

    # 客户端单次请求最大 ~2MB（歌曲元数据远小于这个数）
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE：不缓冲、不缓存、超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
