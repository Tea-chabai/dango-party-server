# ============================================================
#  music.nyaneko.org -> DangoMusic「一起听歌」后端（Node，127.0.0.1:8789）
#  复用现有已转发的端口：7716(HTTP) / 8787(HTTPS)
#  证书：C:/nginx/ssl/nyaneko.org.pem（SAN 含 *.nyaneko.org）
# ============================================================

# ---------- 80/HTTP：只做跳转（也给证书续期留 acme 路径）
server {
    listen      7716;
    server_name music.nyaneko.org;

    location /.well-known/acme-challenge/ {
        root         C:/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host:8787$request_uri;
    }
}

# ---------- 443/HTTPS：反代到 DangoMusic 后端
server {
    listen      8787 ssl;
    http2       on;
    server_name music.nyaneko.org;

    ssl_certificate     C:/nginx/ssl/nyaneko.org.pem;
    ssl_certificate_key C:/nginx/ssl/nyaneko.org.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    access_log C:/nginx/logs/music.access.log main;
    error_log  C:/nginx/logs/music.error.log  warn;

    # ---- 一起听歌的关键：SSE 长连接，必须关缓冲
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Accept-Encoding   "";

    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8789;
    }
}
