<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Dango Party · 控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#111217; --panel:#181a21; --line:#262832; --text:#e8e8ea;
          --dim:#9a9ba6; --faint:#6f7079; --accent:#e8425a; --ok:#2fbf71; --warn:#f0b429; --err:#ff6b81; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px;
           border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .spacer { flex:1; }
  input, button, select { font:inherit; color:var(--text); background:#1d1f27;
          border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.ghost { background:transparent; }
  button.danger { color:#ff8b9a; border-color:#4a2630; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; background:#24262f;
          color:var(--dim); font-size:12px; }
  .pill.ok { background:#173225; color:#7fe0a8; }
  .pill.err { background:#3a1f26; color:#ff8b9a; }
  nav { display:flex; gap:6px; padding:10px 18px 0; border-bottom:1px solid var(--line); background:var(--panel); }
  nav button { border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0;
               background:transparent; color:var(--dim); padding:7px 16px; }
  nav button.active { background:var(--bg); color:var(--text); border-color:var(--line); }
  main { padding:16px 18px 24px; }
  .panel { display:none; }
  .panel.active { display:block; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card .k { color:var(--faint); font-size:12px; }
  .card .v { font-size:20px; font-weight:600; margin-top:2px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--faint); font-weight:500; font-size:12px; }
  code { background:#1d1f27; padding:1px 6px; border-radius:5px; }
  .members { display:flex; flex-direction:column; gap:5px; }
  .member { display:flex; align-items:center; gap:6px; }
  .member .uid { color:var(--faint); font-size:12px; }
  .empty { color:var(--faint); padding:26px 0; text-align:center; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .toolbar label { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:5px; }
  #logbox { height:calc(100vh - 300px); min-height:260px; overflow:auto; background:#0c0d11;
            border:1px solid var(--line); border-radius:10px; padding:10px 12px;
            font:12.5px/1.5 ui-monospace,Consolas,"Cascadia Mono",monospace; white-space:pre-wrap; word-break:break-all; }
  #logbox .l { display:block; }
  #logbox .warn { color:var(--warn); }
  #logbox .err  { color:var(--err); }
  .hint { color:var(--faint); font-size:12px; }
  footer { padding:8px 18px; border-top:1px solid var(--line); color:var(--faint); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Dango Party 控制台</h1>
  <input id="token" placeholder="运维口令（data/admintoken.txt）" size="32">
  <button id="save">保存口令</button>
  <span class="spacer"></span>
  <span id="status" class="pill">未连接</span>
</header>

<nav>
  <button data-tab="rooms" class="active">房间</button>
  <button data-tab="logs">日志</button>
</nav>

<main>
  <section id="tab-rooms" class="panel active">
    <div class="cards" id="stats"></div>
    <table>
      <thead><tr><th>房间码</th><th>房主</th><th>成员</th><th>当前歌曲</th><th>存活</th><th>操作</th></tr></thead>
      <tbody id="rooms"></tbody>
    </table>
    <div id="empty" class="empty" hidden>还没有房间。客户端建房后会出现在这里。</div>
  </section>

  <section id="tab-logs" class="panel">
    <div class="toolbar">
      <label>文件
        <select id="logFile">
          <option value="app">应用日志</option>
          <option value="heartbeat">心跳日志</option>
        </select>
      </label>
      <label>级别
        <select id="logLevel">
          <option value="all">全部</option>
          <option value="warn">警告以上</option>
          <option value="err">仅错误</option>
        </select>
      </label>
      <input id="logSearch" placeholder="过滤关键词" size="16">
      <label><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
      <button id="pause">暂停</button>
      <button id="clear" class="ghost">清屏</button>
      <button id="download" class="ghost">下载</button>
      <span class="spacer"></span>
      <span id="logInfo" class="hint">—</span>
    </div>
    <div id="logbox"></div>
    <div class="hint" style="margin-top:8px">每 2 秒增量拉取；「暂停」只停止刷新，不影响服务端。</div>
  </section>
</main>

<footer>房间页每 2 秒刷新 · 日志页增量拉取 · 口令只存在浏览器 localStorage</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = localStorage.getItem('dangoToken') || '';
$('token').value = token;
$('save').onclick = () => {
  token = $('token').value.trim();
  localStorage.setItem('dangoToken', token);
  logReset(); refreshRooms(); refreshLogs(true);
};

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab));
    if (btn.dataset.tab === 'logs') refreshLogs(true);
  };
});

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 'token=' + encodeURIComponent(token), opts || {});
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 140));
  return res.json();
}
function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'pill' + (cls ? ' ' + cls : '');
}

/* ---------------- 房间 ---------------- */
const fmtAge = (ms) => {
  if (ms == null) return '-';
  const m = Math.round(ms / 60000);
  return m < 1 ? '<1 分钟' : m + ' 分钟';
};

async function refreshRooms() {
  if (!token) { setStatus('需要口令'); return; }
  try {
    const data = await api('/admin/dashboard');
    const rooms = data.rooms || [];
    setStatus('已连接', 'ok');
    $('empty').hidden = rooms.length > 0;
    let listeners = 0;
    $('rooms').innerHTML = rooms.map(r => {
      const members = (r.members || []).map(m => {
        const isHost = m.uid === r.host;
        listeners++;
        return '<div class="member">'
          + (isHost ? '<span class="pill">房主</span>' : '<span class="pill">成员</span>')
          + '<span>' + esc(m.name || '?') + '</span>'
          + '<span class="uid">' + esc(String(m.uid || '').slice(0, 8)) + '</span>'
          + (isHost ? '' : '<button class="danger" data-kick="' + esc(r.code) + '|' + esc(m.uid) + '">踢</button>')
          + '</div>';
      }).join('') || '<span class="uid">（空）</span>';
      const st = r.state ? (esc(r.state.name || '') + (r.state.playing ? ' ▶' : ' ⏸')) : '<span class="uid">未播放</span>';
      return '<tr>'
        + '<td><code>' + esc(r.code) + '</code></td>'
        + '<td>' + esc(r.hostName || '?') + '</td>'
        + '<td><div class="members">' + members + '</div></td>'
        + '<td>' + st + '</td>'
        + '<td>' + fmtAge(r.ageMs) + '</td>'
        + '<td><button class="danger" data-close="' + esc(r.code) + '">关闭房间</button></td>'
        + '</tr>';
    }).join('');

    const s = data.stats;
    $('stats').innerHTML = [
      ['版本', esc(s.server)],
      ['协议', esc(s.protocol)],
      ['房间', s.rooms],
      ['在线成员', listeners],
      ['登录', s.signups],
      ['写入', s.writes],
      ['拒绝', s.rejected],
      ['运行', Math.round(s.uptimeSec / 60) + ' 分钟'],
    ].map(([k, v]) => '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('');
  } catch (e) {
    setStatus('出错', 'err');
    $('stats').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  }
}

document.addEventListener('click', async (ev) => {
  const t = ev.target;
  if (!(t instanceof HTMLButtonElement)) return;
  const close = t.dataset.close, kick = t.dataset.kick;
  if (!close && !kick) return;
  if (close) {
    if (!confirm('关闭房间 ' + close + '？房间里的玩家会立刻解散。')) return;
    await api('/admin/rooms/' + encodeURIComponent(close), { method: 'DELETE' });
  } else {
    const [code, uid] = kick.split('|');
    if (!confirm('把 ' + uid.slice(0, 8) + ' 踢出房间 ' + code + '？')) return;
    await api('/admin/rooms/' + encodeURIComponent(code) + '/members/' + encodeURIComponent(uid), { method: 'DELETE' });
  }
  refreshRooms();
});

/* ---------------- 日志 ---------------- */
const MAX_LINES = 2000;
const log = { offset: 0, lines: [], pending: '', paused: false, loading: false, missing: false };

function logReset() {
  log.offset = 0; log.lines = []; log.pending = ''; log.missing = false;
  $('logbox').innerHTML = '';
  $('logInfo').textContent = '—';
}

function levelOf(line) {
  if (/(ERR|ERROR|FATAL|失败|异常|Unhandled|rejected)/i.test(line)) return 'err';
  if (/(WARN|WARNING|警告|超时|timed out)/i.test(line)) return 'warn';
  return 'info';
}

function renderLogs() {
  const lvl = $('logLevel').value;
  const kw = $('logSearch').value.trim().toLowerCase();
  const box = $('logbox');
  const wasBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
  const rows = log.lines.filter(line => {
    if (lvl === 'err' && levelOf(line) !== 'err') return false;
    if (lvl === 'warn' && levelOf(line) === 'info') return false;
    if (kw && !line.toLowerCase().includes(kw)) return false;
    return true;
  });
  box.innerHTML = rows.map(line => {
    const cls = levelOf(line);
    return '<span class="l ' + (cls === 'err' ? 'err' : cls === 'warn' ? 'warn' : '') + '">' + esc(line) + '</span>';
  }).join('');
  if ($('autoScroll').checked && wasBottom) box.scrollTop = box.scrollHeight;
  $('logInfo').textContent = rows.length + ' / ' + log.lines.length + ' 行 · ' + (log.missing ? '文件不存在' : 'offset ' + log.offset);
}

async function refreshLogs(force) {
  if (!token) return;
  if (log.paused && !force) return;
  if (log.loading) return;
  log.loading = true;
  try {
    const file = $('logFile').value;
    const r = await api('/admin/logs?file=' + encodeURIComponent(file) + '&offset=' + log.offset);
    if (r.missing) {
      log.missing = true;
      log.lines = ['[控制台] 找不到日志文件：' + (r.path || file) + '（Windows 计划任务部署才会有 server.log）'];
      renderLogs();
      return;
    }
    log.missing = false;
    if (r.size < log.offset) { log.loading = false; logReset(); return refreshLogs(true); }
    if (r.chunk) {
      const text = log.pending + r.chunk;
      const parts = text.split(/\r?\n/);
      log.pending = parts.pop() || '';
      for (const line of parts) if (line.length) log.lines.push(line);
      if (log.lines.length > MAX_LINES) log.lines = log.lines.slice(-MAX_LINES);
    }
    log.offset = r.offset;
    renderLogs();
  } catch (e) {
    $('logInfo').textContent = '读取失败：' + e.message;
  } finally {
    log.loading = false;
  }
}

$('logFile').onchange = () => { logReset(); refreshLogs(true); };
$('logLevel').onchange = renderLogs;
$('logSearch').oninput = renderLogs;
$('pause').onclick = () => {
  log.paused = !log.paused;
  $('pause').textContent = log.paused ? '继续' : '暂停';
  if (!log.paused) refreshLogs(true);
};
$('clear').onclick = () => { log.lines = []; renderLogs(); };
$('download').onclick = () => {
  const blob = new Blob([log.lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dango-party-' + $('logFile').value + '-' + new Date().toISOString().replace(/[:.]/g, '-') + '.log';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------------- 定时 ---------------- */
refreshRooms();
setInterval(refreshRooms, 2000);
setInterval(() => { if ($('tab-logs').classList.contains('active')) refreshLogs(false); }, 2000);
</script>
</body>
</html>
