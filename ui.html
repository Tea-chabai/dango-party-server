<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Dango Party · 控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #14151a; color: #e8e8ea; }
  header { padding: 16px 20px; border-bottom: 1px solid #26272e; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid #30313a; background: #1c1d24; color: #e8e8ea; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: #e8425a; }
  button.danger { border-color: #5c2730; color: #ff8b9a; }
  main { padding: 16px 20px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; color: #9a9ba6; margin-bottom: 14px; }
  .stats b { color: #e8e8ea; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #24252c; vertical-align: top; }
  th { color: #8a8b96; font-weight: 500; font-size: 12px; }
  code { background: #1c1d24; padding: 1px 5px; border-radius: 5px; }
  .members { display: flex; flex-direction: column; gap: 4px; }
  .member { display: flex; align-items: center; gap: 6px; }
  .member .uid { color: #6f7079; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; background: #2a2b33; font-size: 12px; color: #b9bac4; }
  .pill.host { background: #3a2028; color: #ff8b9a; }
  .empty { color: #6f7079; padding: 20px 0; }
  .err { color: #ff8b9a; }
  footer { padding: 10px 20px; color: #6f7079; font-size: 12px; border-top: 1px solid #24252c; }
</style>
</head>
<body>
<header>
  <h1>Dango Party 控制台</h1>
  <input id="token" placeholder="运维口令（data/admintoken.txt）" size="34">
  <button id="save">保存口令</button>
  <span id="status" class="pill">未连接</span>
</header>
<main>
  <div class="stats" id="stats"></div>
  <table>
    <thead><tr><th>房间码</th><th>房主</th><th>成员</th><th>当前歌曲</th><th>存活</th><th>操作</th></tr></thead>
    <tbody id="rooms"></tbody>
  </table>
  <div id="empty" class="empty" hidden>还没有房间。客户端建房后会出现在这里。</div>
</main>
<footer>每 2 秒自动刷新 · 口令只存在浏览器 localStorage</footer>
<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('dangoToken') || '';
$('token').value = token;
$('save').onclick = () => { token = $('token').value.trim(); localStorage.setItem('dangoToken', token); refresh(); };

const fmtAge = (ms) => {
  if (ms == null) return '-';
  const m = Math.round(ms / 60000);
  return m < 1 ? '<1 分钟' : m + ' 分钟';
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, method) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 'token=' + encodeURIComponent(token), { method: method || 'GET' });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 120));
  return res.json();
}

async function refresh() {
  if (!token) { $('status').textContent = '需要口令'; $('status').classList.remove('err'); return; }
  try {
    const data = await api('/admin/rooms');
    const rooms = data.rooms || [];
    $('status').textContent = '已连接';
    $('empty').hidden = rooms.length > 0;
    let listeners = 0;
    $('rooms').innerHTML = rooms.map(r => {
      const members = (r.members || []).map(m => {
        const isHost = m.uid === r.host;
        return '<div class="member">'
          + (isHost ? '<span class="pill host">房主</span>' : '<span class="pill">成员</span>')
          + '<span>' + esc(m.name || '?') + '</span>'
          + '<span class="uid">' + esc(String(m.uid || '').slice(0, 8)) + '</span>'
          + (isHost ? '' : '<button class="danger" data-kick="' + esc(r.code) + '|' + esc(m.uid) + '">踢</button>')
          + '</div>';
      }).join('') || '<span class="uid">（空）</span>';
      listeners += (r.members || []).length;
      const state = r.state ? (esc(r.state.name || '') + (r.state.playing ? ' ▶' : ' ⏸')) : '<span class="uid">未播放</span>';
      return '<tr>'
        + '<td><code>' + esc(r.code) + '</code></td>'
        + '<td>' + esc(r.hostName || '?') + '</td>'
        + '<td><div class="members">' + members + '</div></td>'
        + '<td>' + state + '</td>'
        + '<td>' + fmtAge(r.ageMs) + '</td>'
        + '<td><button class="danger" data-close="' + esc(r.code) + '">关闭房间</button></td>'
        + '</tr>';
    }).join('');

    const s = await api('/admin/stats');
    $('stats').innerHTML = ['版本 ' + esc(s.server), '协议 ' + esc(s.protocol), '房间 <b>' + s.rooms + '</b>',
      '在线成员 <b>' + listeners + '</b>', '登录 <b>' + s.signups + '</b>', '写入 <b>' + s.writes + '</b>',
      '拒绝 <b>' + s.rejected + '</b>', '运行 ' + Math.round(s.uptimeSec / 60) + ' 分钟'].join(' · ');
  } catch (e) {
    $('status').textContent = '出错';
    $('status').classList.add('err');
    $('stats').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  }
}

document.addEventListener('click', async (ev) => {
  const t = ev.target;
  if (!(t instanceof HTMLButtonElement)) return;
  const close = t.dataset.close, kick = t.dataset.kick;
  if (close) {
    if (!confirm('关闭房间 ' + close + '？房间里的玩家会立刻解散。')) return;
    await api('/admin/rooms/' + encodeURIComponent(close), 'DELETE');
  } else if (kick) {
    const [code, uid] = kick.split('|');
    if (!confirm('把 ' + uid.slice(0, 8) + ' 踢出房间 ' + code + '？')) return;
    await api('/admin/rooms/' + encodeURIComponent(code) + '/members/' + encodeURIComponent(uid), 'DELETE');
  }
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
