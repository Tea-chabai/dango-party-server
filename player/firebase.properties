#### Dango Music · 一起听歌（自建服务器）
#### 放到 <游戏目录>/config/dangomusic/firebase.properties
#### 把下面两处 party.example.com 改成你自己的服务器域名（必须是 https）
#### apiKey 必须和服务器的口令一致：服务器启动时会打印，也存在 data/apikey.txt
####   最省事：直接拿服务器自动生成的 data/firebase.properties 覆盖本文件

apiKey=local-party
databaseUrl=https://party.example.com
relayUrl=https://party.example.com
