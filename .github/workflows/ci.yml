name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 协议一致性测试（自己拉起服务器跑完整房间流程）
        run: npm test

      - name: 命令行参数
        run: |
          node server.mjs --version
          node server.mjs --help

      - name: 端口占用时有友好提示
        run: |
          node server.mjs &
          sleep 1
          set +e
          out=$(node server.mjs 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit=$code"
          test "$code" -eq 1
          echo "$out" | grep -q "已被占用"
          kill %1
