name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 协议一致性测试（自己拉起服务器跑完整房间流程）
        run: npm test

      - name: 命令行参数
        run: |
          node server.mjs --version
          node server.mjs --help

      - name: 自带 TLS 模式（不用反代）
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj '/CN=localhost'
          TLS_CERT=cert.pem TLS_KEY=key.pem PORT=9443 QUIET=1 node server.mjs &
          sleep 1
          curl -sk --fail https://127.0.0.1:9443/healthz
          curl -sk --fail -X POST 'https://127.0.0.1:9443/id/v1/accounts:signUp?key=k' \
            -H 'Content-Type: application/json' -d '{"returnSecureToken":true}'
          kill %1

      - name: 端口占用时有友好提示
        run: |
          node server.mjs &
          sleep 1
          set +e
          out=$(node server.mjs 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit=$code"
          test "$code" -eq 1
          echo "$out" | grep -q "已被占用"
          kill %1
